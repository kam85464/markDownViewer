<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title><%= title %></title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-<%= nonce %>'; style-src 'self' 'nonce-<%= nonce %>' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; connect-src 'self' https:;" />
    <script nonce="<%= nonce %>">
      window.MonacoEnvironment = { nonce: '<%= nonce %>' };
    </script>
    <!-- Open Graph / Facebook -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://mark-down-viewer.vercel.app/" />
<meta property="og:title" content="Markdown Viewer Pro" />
<meta property="og:description" content="A powerful Markdown viewer built with Electron and React." />
<meta property="og:image" content="/logo.png" />

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image" />
<meta property="twitter:url" content="https://mark-down-viewer.vercel.app/" />
<meta property="twitter:title" content="Markdown Viewer Pro" />
<meta property="twitter:description" content="A powerful Markdown viewer built with Electron and React." />
<meta property="twitter:image" content="/logo.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
